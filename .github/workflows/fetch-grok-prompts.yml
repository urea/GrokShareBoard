name: Fetch Grok prompts

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum rows to process"
        required: false
        default: "100"
      delay_ms:
        description: "Delay between Grok API calls"
        required: false
        default: "750"
      max_source_depth:
        description: "Maximum originalPost ancestry depth to fetch"
        required: false
        default: "3"
      grok_id:
        description: "Process one Grok post UUID, including terminal statuses"
        required: false
        default: ""
      retry_no_prompt:
        description: "Retry no_prompt rows after Grok API migrations"
        type: boolean
        required: false
        default: false
      retry_access_denied:
        description: "Retry access_denied rows"
        type: boolean
        required: false
        default: false
      apply_nsfw:
        description: "Set nsfw=true when Grok marks the media rRated"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: grok-prompt-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci
        working-directory: _App

      - name: Fetch prompts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LIMIT: ${{ inputs.limit || '100' }}
          DELAY_MS: ${{ inputs.delay_ms || '750' }}
          MAX_SOURCE_DEPTH: ${{ inputs.max_source_depth || '3' }}
          GROK_ID: ${{ inputs.grok_id }}
          RETRY_NO_PROMPT: ${{ inputs.retry_no_prompt }}
          RETRY_ACCESS_DENIED: ${{ inputs.retry_access_denied }}
          APPLY_NSFW: ${{ inputs.apply_nsfw || false }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL repository secret is required."
            exit 1
          fi

          COMMAND=(node scripts/fetch_grok_prompts.js --apply --limit "$LIMIT" --delay-ms "$DELAY_MS" --max-source-depth "$MAX_SOURCE_DEPTH")

          if [ -n "$GROK_ID" ]; then
            COMMAND+=(--id "$GROK_ID")
          fi

          if [ "$RETRY_NO_PROMPT" = "true" ]; then
            COMMAND+=(--retry-no-prompt)
          fi

          if [ "$RETRY_ACCESS_DENIED" = "true" ]; then
            COMMAND+=(--retry-access-denied)
          fi

          if [ "$APPLY_NSFW" = "true" ]; then
            COMMAND+=(--apply-nsfw)
          fi

          "${COMMAND[@]}"
        working-directory: _App
