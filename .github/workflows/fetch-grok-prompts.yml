name: Fetch Grok prompts

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum rows to process"
        required: false
        default: "50"
      delay_ms:
        description: "Delay between Grok API calls"
        required: false
        default: "750"
      retry_access_denied:
        description: "Retry rows waiting for Grok public share"
        type: boolean
        required: false
        default: true
      apply_nsfw:
        description: "Set nsfw=true when Grok marks the media rRated"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: grok-prompt-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "_App/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: _App

      - name: Fetch prompts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LIMIT: ${{ inputs.limit || '50' }}
          DELAY_MS: ${{ inputs.delay_ms || '750' }}
          RETRY_ACCESS_DENIED: ${{ inputs.retry_access_denied != false }}
          APPLY_NSFW: ${{ inputs.apply_nsfw || false }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL repository secret is required."
            exit 1
          fi

          COMMAND=(node scripts/fetch_grok_prompts.js --apply --limit "$LIMIT" --delay-ms "$DELAY_MS")

          if [ "$RETRY_ACCESS_DENIED" = "true" ]; then
            COMMAND+=(--retry-access-denied)
          fi

          if [ "$APPLY_NSFW" = "true" ]; then
            COMMAND+=(--apply-nsfw)
          fi

          "${COMMAND[@]}"
        working-directory: _App
